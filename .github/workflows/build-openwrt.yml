name: Build Full OpenWrt x86 (Optimized)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Maximize disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3 python3-setuptools rsync swig unzip zlib1g-dev file wget cpio curl

    - name: Clone lede source
      run: |
        git clone https://github.com/coolsnowwolf/lede openwrt
        cd openwrt && git checkout master

    - name: Fix Windows line endings
      run: |
        sed -i 's/\r$//' diy-part1.sh
        sed -i 's/\r$//' diy-part2.sh

    - name: Pre-config (diy-part1)
      run: |
        cp feeds.conf.default openwrt/
        cp diy-part1.sh openwrt/
        cd openwrt && bash diy-part1.sh

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        # 官方推荐：从 istore feed 安装 luci-app-store
        ./scripts/feeds install -p istore luci-app-store

    - name: DIY part2 (add DDNS-GO, filebrowser prebuilt)
      run: |
        cp diy-part2.sh openwrt/
        cd openwrt && bash diy-part2.sh

    - name: Load custom config
      run: cp .config openwrt/ && cd openwrt && make defconfig

    - name: Download all sources
      run: cd openwrt && make download -j1 V=s

    - name: Compile firmware (2 jobs first, automatically fallback to 1)
      run: |
        export FORCE_UNSAFE_CONFIGURE=1
        cd openwrt
        echo "Starting compilation with 2 parallel jobs..."
        # 用 PIPESTATUS 准确捕获 make 的退出码，同时过滤界面输出避免被截断
        make -j2 V=s 2>&1 | tee compile.log | grep -a -E "(error:|Error|make\[.*\]|package/)" || true
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "Compilation failed with -j2, retrying with single job..."
          make -j1 V=s 2>&1 | tee compile-single.log
        else
          echo "Compilation succeeded with -j2!"
        fi
      env:
        CCACHE_DISABLE: 1

    - name: Collect firmware artifacts
      run: |
        mkdir -p openwrt/artifacts
        find openwrt/bin/targets/x86 -type f \( -name "*.img.gz" -o -name "*.vmdk" -o -name "*.qcow2" \) -exec cp {} openwrt/artifacts/ \;

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_x86_Plus_Full
        path: openwrt/artifacts/

    # ---------- 自动发布到 Releases ----------
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      with:
        tag_name: v${{ github.run_number }}
        name: "OpenWrt x86 Build ${{ github.run_number }}"
        body: |
          🚀 自动编译 x86 固件
          📦 包含插件：PassWall/PassWall2/OpenClash/SSR-Plus/Docker/NAS/AI/VPN/流控/iStore 等
          🔑 默认 IP：192.168.2.1  密码：password
        files: openwrt/artifacts/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
