name: Build Full OpenWrt x86

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3 python3-setuptools rsync swig unzip zlib1g-dev file wget cpio curl

    - name: Clone source
      run: |
        git clone https://github.com/coolsnowwolf/lede openwrt
        cd openwrt && git checkout master

    - name: Remove Windows line endings
      run: |
        sed -i 's/\r$//' diy-part1.sh
        sed -i 's/\r$//' diy-part2.sh

    - name: Pre-config
      run: |
        cp feeds.conf.default openwrt/
        cp diy-part1.sh openwrt/
        cd openwrt && bash diy-part1.sh

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

    - name: DIY part2
      run: |
        cp diy-part2.sh openwrt/
        cd openwrt && bash diy-part2.sh

    - name: Load config
      run: cp .config openwrt/ && cd openwrt && make defconfig

    - name: Download
      run: cd openwrt && make download -j$(nproc)

    - name: Compile
      run: |
        export FORCE_UNSAFE_CONFIGURE=1
        export ERROR_SILENT=0
        cd openwrt
        make -j1 V=s 2>&1 | tee compile.log | grep -E "(error:|Error|package/|Build of|Compilation)" || true
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "Compilation failed. Last 100 lines of log:"
          tail -100 compile.log
          exit 1
        fi

    - name: Collect
      run: |
        mkdir -p openwrt/artifacts
        find openwrt/bin/targets/x86 -type f \( -name "*.img.gz" -o -name "*.vmdk" -o -name "*.qcow2" \) -exec cp {} openwrt/artifacts/ \;

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_x86_Plus
        path: openwrt/artifacts/
