name: Build Full OpenWrt x86 (Optimized)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Maximize disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: true

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3 python3-setuptools rsync swig unzip zlib1g-dev file wget cpio curl

    - name: Clone lede source
      run: |
        git clone https://github.com/coolsnowwolf/lede openwrt
        cd openwrt && git checkout master

    - name: Fix Windows line endings
      run: |
        sed -i 's/\r$//' diy-part1.sh
        sed -i 's/\r$//' diy-part2.sh

    - name: Pre-config (diy-part1)
      run: |
        cp feeds.conf.default openwrt/
        cp diy-part1.sh openwrt/
        cd openwrt && bash diy-part1.sh

    - name: Update and install feeds
      run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

    - name: DIY part2 (add iStore, DDNS-GO, fix deps)
      run: |
        cp diy-part2.sh openwrt/
        cd openwrt && bash diy-part2.sh

    - name: Load custom config
      run: cp .config openwrt/ && cd openwrt && make defconfig

    - name: Download all sources (single thread, no timeout)
      run: cd openwrt && make download -j1 V=s

    # 编译：先双线程，失败自动回退单线程
    - name: Compile firmware (2 jobs first, then fallback)
      run: |
        export FORCE_UNSAFE_CONFIGURE=1
        cd openwrt
        echo "Compiling with 2 parallel jobs..."
        if make -j2 V=sc 2>&1 | tee compile.log | grep -E "(error:|Error|make\[.*\]|package/)" || true
        then
          echo "Build succeeded with -j2"
        else
          echo "Build failed with -j2, retrying with single thread..."
          make -j1 V=s 2>&1 | tee compile-single.log
        fi
      env:
        CCACHE_DISABLE: 1

    - name: Collect firmware artifacts
      run: |
        mkdir -p openwrt/artifacts
        find openwrt/bin/targets/x86 -type f \( -name "*.img.gz" -o -name "*.vmdk" -o -name "*.qcow2" \) -exec cp {} openwrt/artifacts/ \;

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_x86_Plus_Full
        path: openwrt/artifacts/
